name: Uptime

# Every 15 minutes, opens the live site in a real browser (scripts/smoke.mjs).
# If it's broken, an issue labelled "site-down" is opened, so GitHub emails you.
# When it recovers, the issue is closed with a note of how long it was down.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the live site
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # One retry a minute later, so a single network blip doesn't page anyone.
          # set +e so the log is printed even when the retry fails too.
          set +e
          node scripts/smoke.mjs > smoke.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then sleep 60; node scripts/smoke.mjs > smoke.log 2>&1; status=$?; fi
          cat smoke.log
          exit $status
      - name: Open or close the site-down issue
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('smoke.log') ? fs.readFileSync('smoke.log', 'utf8').slice(-6000) : '(no log)';
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'site-down' })).data;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.OUTCOME === 'success') {
              for (const i of open) {
                const mins = Math.round((Date.now() - Date.parse(i.created_at)) / 60000);
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `✅ Back up (down for about ${mins} minutes). ${run}` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
              return;
            }
            const body = `The live site failed its check. ${run}\n\n\`\`\`\n${log}\n\`\`\``;
            if (open.length) await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: `Still down. ${run}` });
            else await github.rest.issues.create({ owner, repo, title: '🚨 The league site is down', labels: ['site-down'], body });
            core.setFailed('Site is down');
