name: NHL probe (temporary)
on:
  push:
    branches: [claude/kind-hamilton-9wx9ef]
    paths: [scripts/nhl-probe.mjs, .github/workflows/nhl-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/nhl-probe.mjs
