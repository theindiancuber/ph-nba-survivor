name: NHL dry run (temporary)
on:
  push:
    branches: [claude/kind-hamilton-9wx9ef]
    paths: [.github/workflows/nhl-dryrun.yml]
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: PHS_SPORT=nhl node scripts/update-nhl.mjs
      - name: Summary
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const r = f => JSON.parse(fs.readFileSync('nhl/data/' + f + '.json', 'utf8'));
            const w = r('weeks').weeks, p = r('players').players, t = r('totals').weeks, tm = r('teams').teams;
            console.log('weeks', w.length, 'wk1', w[0].start, w[0].lockAt, w[0].firstGame, 'games', w[0].games, 'last', w.at(-1).start, w.at(-1).games);
            console.log('players', Object.keys(p).length, 'goalies', Object.values(p).filter(x => x.pos === 'G').length);
            const top = (k, n = 5) => Object.values(p).sort((a, b) => b.avg[k] - a.avg[k]).slice(0, n).map(x => [x.name, x.team, x.pos, x.gp, x.avg]);
            console.log('top ppg', JSON.stringify(top(0)));
            console.log('top sv', JSON.stringify(Object.values(p).filter(x => x.pos === 'G' && x.gp >= 5).sort((a, b) => b.avg[2] - a.avg[2]).slice(0, 5).map(x => [x.name, x.team, x.gp, x.avg])));
            console.log('top fights', JSON.stringify(top(3)));
            console.log('teams', JSON.stringify(Object.entries(tm).slice(0, 6)));
            console.log('totals weeks', Object.keys(t), 'sample', JSON.stringify(Object.values(p).slice(0, 2)));
            console.log('games cached', fs.readdirSync('nhl/data/games').length, 'rosters', Object.keys(r('rosters').teams).length);
            console.log('sizes', fs.readdirSync('nhl/data').map(f => f + ':' + (fs.statSync('nhl/data/' + f).isFile() ? fs.statSync('nhl/data/' + f).size : 'dir')).join(' '));
          "
