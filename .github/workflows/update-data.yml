name: Update league data

on:
  schedule:
    # GitHub runs scheduled jobs best-effort and drops many of them (an hourly schedule was
    # running every 5-6 hours). So ask often, and let each run that does start stay up and
    # refresh every few minutes for as long as games are on (see the loop below).
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A game night: up to ~5.5 hours of refreshing. Runs never overlap (concurrency above).
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine tests
        run: npm test
      - name: Pull box scores, sync locks, run Autopilot (every 8 minutes while games are on)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIVE_FLAG: ${{ runner.temp }}/live
          LIVE_FLAG_NHL: ${{ runner.temp }}/live-nhl
        run: |
          git config user.name "survivor-bot"
          git config user.email "survivor-bot@users.noreply.github.com"
          # Both leagues update in the same round and commit together: one Pages build per round
          # keeps GitHub Pages under its ~10 builds an hour.
          end=$(( $(date +%s) + 330 * 60 ))
          ok=0; ok_nhl=0
          while :; do
            # Start every round from the latest main. A run can start long after it was queued (runs
            # never overlap), and a stale checkout once hit a rebase conflict that left every later
            # push failing for hours.
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git checkout -q -B main origin/main && git reset -q --hard origin/main
            # timeout: a round that hangs past 6 minutes is killed so the next one can start.
            if timeout 360 node scripts/update-data.mjs; then ok=1; else echo "::warning::NBA update failed; trying again next round."; fi
            # Same Supabase project as the NBA league (its tables are in the nhl schema).
            if LIVE_FLAG="$LIVE_FLAG_NHL" PHS_SPORT=nhl timeout 360 node scripts/update-nhl.mjs; then
              ok_nhl=1
            else
              echo "::warning::NHL update failed; trying again next round."
            fi
            git add data nhl/data
            if git diff --cached --quiet; then
              echo "No data changes."
            else
              git commit -q -m "Update NBA and NHL data"
              for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; git rebase --abort 2>/dev/null; sleep 5; done
            fi
            [ -s "$LIVE_FLAG" ] || [ -s "$LIVE_FLAG_NHL" ] || break
            [ $(( $(date +%s) + 8 * 60 )) -lt "$end" ] || break
            sleep 480
          done
          # Fail the run if either league never updated, so a broken job shows up red.
          [ "$ok" = 1 ] && [ "$ok_nhl" = 1 ]
